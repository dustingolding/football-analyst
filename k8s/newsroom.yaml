# Automated newsroom (newsroom.py): recaps, previews and Tuesday editorials written by the local LLM
# (Ollama in the ai namespace), fact-checked, then published or queued for review at /newsroom.
#   schedule ${NEWSROOM_SCHEDULE} (cron), suspended: ${NEWSROOM_SUSPEND}. Runs with nothing due finish in seconds.
# Only one environment should write at a time: both share the one GPU.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: newsroom
  namespace: ${NAMESPACE}
spec:
  schedule: "${NEWSROOM_SCHEDULE}"
  timeZone: America/New_York
  suspend: ${NEWSROOM_SUSPEND}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3300
      template:
        metadata:
          labels:
            app: newsroom
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: newsroom
              image: ${PIPELINE_IMAGE}
              imagePullPolicy: Never
              command: ["python", "newsroom.py"]
              envFrom:
                - secretRef:
                    name: pipeline-env
                - secretRef:        # OPENAI_KEY: GPT writes and checks; without it the local model does
                    name: openai
                    optional: true
              env:
                - {name: NEWSROOM_LIMIT, value: "6"}
                - {name: NEWSROOM_AUTOPUBLISH, value: "${NEWSROOM_AUTOPUBLISH}"}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
---
# Newsroom worker: rewrites articles queued from /admin ("Regenerate") within ~20 s. Idle otherwise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsroom-worker
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: newsroom-worker}
  template:
    metadata:
      labels: {app: newsroom-worker}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: ${PIPELINE_IMAGE}
          imagePullPolicy: Never
          command: ["python", "newsroom.py", "--watch"]
          envFrom:
            - secretRef:
                name: pipeline-env
            - secretRef:
                name: openai
                optional: true
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 512Mi}
