# Scheduled pipeline runs (pipeline.py). Times are US Eastern.
#   refresh-gameday  every 15 min, Thu-Mon 11:00-23:59  (game windows)
#   refresh-hourly   hourly, every day                  (lines/schedules the rest of the time)
#   daily            04:30 daily                        (play-by-play/EPA, box scores, rosters, polls)
#   weekly           Tue 05:30                          (daily + retrain after Monday night)
# Overlaps are handled in pipeline.py with a Postgres advisory lock (refresh skips, others wait).
# data/ and models/ are the repo folders on this node, shared with manual runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-gameday
  namespace: football-analyst
spec:
  schedule: "*/15 11-23 * * 4,5,6,0,1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0          # the next scheduled run is the retry
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app: pipeline
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: pipeline
              image: football-analyst-pipeline:20260925-000539
              imagePullPolicy: Never
              args: ["refresh"]
              envFrom:
                - secretRef:
                    name: pipeline-env
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits: {memory: 4Gi}
              volumeMounts:
                - {name: data, mountPath: /app/data}
                - {name: models, mountPath: /app/models}
          volumes:
            - name: data
              hostPath: {path: /home/dustin/football-analyst/data, type: Directory}
            - name: models
              hostPath: {path: /home/dustin/football-analyst/models, type: Directory}
---
