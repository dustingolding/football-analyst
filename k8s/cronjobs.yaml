apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily
  namespace: football-analyst
spec:
  schedule: "30 4 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: pipeline
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: pipeline
              image: football-analyst-pipeline:20260925-000539
              imagePullPolicy: Never
              args: ["daily"]
              envFrom:
                - secretRef:
                    name: pipeline-env
              resources:
                requests: {cpu: "2", memory: 4Gi}
                limits: {memory: 16Gi}   # CFB EPA holds ~3M plays in memory
              volumeMounts:
                - {name: data, mountPath: /app/data}
                - {name: models, mountPath: /app/models}
          volumes:
            - name: data
              hostPath: {path: /home/dustin/football-analyst/data, type: Directory}
            - name: models
              hostPath: {path: /home/dustin/football-analyst/models, type: Directory}
---
