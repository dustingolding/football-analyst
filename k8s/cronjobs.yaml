apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily
  namespace: ${NAMESPACE}
spec:
  schedule: "${DAILY_SCHEDULE}"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: pipeline
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: pipeline
              image: ${PIPELINE_IMAGE}
              imagePullPolicy: Never
              args: ["daily"]
              envFrom:
                - secretRef:
                    name: pipeline-env
              env:
                - {name: OPENBLAS_NUM_THREADS, value: \"4\"}
                - {name: OMP_NUM_THREADS, value: \"4\"}
              resources:
                requests: {cpu: "2", memory: 4Gi}
                limits: {memory: 16Gi}   # CFB EPA holds ~3M plays in memory
              volumeMounts:
                - {name: data, mountPath: /app/data}
                - {name: models, mountPath: /app/models}
          volumes:
            - name: data
              hostPath: {path: ${APP_DIR}/data, type: Directory}
            - name: models
              hostPath: {path: ${APP_DIR}/models, type: Directory}
---
