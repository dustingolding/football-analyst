# Scheduled pipeline runs (pipeline.py). Times are US Eastern.
#   refresh-gameday  ${REFRESH_GAMEDAY_SCHEDULE} (cron)   (every 15 min in game windows)
#   refresh-hourly   ${REFRESH_HOURLY_SCHEDULE} (cron)    (hourly the rest of the time)
#   daily            ${DAILY_SCHEDULE} (cron)            (play-by-play/EPA, box scores, rosters, polls)
#   weekly           ${WEEKLY_SCHEDULE} (cron)            (daily + retrain after Monday night)
# Overlaps are handled in pipeline.py with a Postgres advisory lock (refresh skips, others wait).
# data/ and models/ are the checkout's folders on this node (APP_DIR), shared with manual runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-gameday
  namespace: ${NAMESPACE}
spec:
  schedule: "${REFRESH_GAMEDAY_SCHEDULE}"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0          # the next scheduled run is the retry
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app: pipeline
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: pipeline
              image: ${PIPELINE_IMAGE}
              imagePullPolicy: Never
              args: ["refresh"]
              envFrom:
                - secretRef:
                    name: pipeline-env
              env:
                - {name: OPENBLAS_NUM_THREADS, value: \"4\"}
                - {name: OMP_NUM_THREADS, value: \"4\"}
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits: {memory: 4Gi}
              volumeMounts:
                - {name: data, mountPath: /app/data}
                - {name: models, mountPath: /app/models}
          volumes:
            - name: data
              hostPath: {path: ${APP_DIR}/data, type: Directory}
            - name: models
              hostPath: {path: ${APP_DIR}/models, type: Directory}
---
