{"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": "dashboard-sw-newsroom", "namespace": "monitoring", "labels": {"grafana_dashboard": "1"}, "annotations": {"grafana_folder": "SidelineWire"}}, "data": {"sw-newsroom.json": "{\n \"uid\": \"sw-newsroom\",\n \"title\": \"SidelineWire \\u00b7 Newsroom\",\n \"description\": \"AI newsroom output, review queue, check pass rate and OpenAI usage.\",\n \"tags\": [\n  \"sidelinewire\"\n ],\n \"timezone\": \"America/New_York\",\n \"schemaVersion\": 39,\n \"version\": 1,\n \"editable\": true,\n \"graphTooltip\": 1,\n \"refresh\": \"5m\",\n \"time\": {\n  \"from\": \"now-30d\",\n  \"to\": \"now\"\n },\n \"templating\": {\n  \"list\": [\n   {\n    \"type\": \"datasource\",\n    \"name\": \"ds\",\n    \"label\": \"Environment\",\n    \"query\": \"grafana-postgresql-datasource\",\n    \"regex\": \"/SidelineWire/\",\n    \"current\": {\n     \"text\": \"SidelineWire prod DB\",\n     \"value\": \"pg-prod\"\n    }\n   },\n   {\n    \"type\": \"custom\",\n    \"name\": \"ns\",\n    \"label\": \"Environment\",\n    \"query\": \"prod : sidelinewire,dev : football-analyst\",\n    \"current\": {\n     \"text\": \"prod\",\n     \"value\": \"sidelinewire\"\n    },\n    \"options\": [\n     {\n      \"text\": \"prod\",\n      \"value\": \"sidelinewire\",\n      \"selected\": true\n     },\n     {\n      \"text\": \"dev\",\n      \"value\": \"football-analyst\",\n      \"selected\": false\n     }\n    ]\n   },\n   {\n    \"type\": \"textbox\",\n    \"name\": \"in_price\",\n    \"label\": \"Input $/1M tokens\",\n    \"query\": \"0\",\n    \"current\": {\n     \"text\": \"0\",\n     \"value\": \"0\"\n    }\n   },\n   {\n    \"type\": \"textbox\",\n    \"name\": \"out_price\",\n    \"label\": \"Output $/1M tokens\",\n    \"query\": \"0\",\n    \"current\": {\n     \"text\": \"0\",\n     \"value\": \"0\"\n    }\n   }\n  ]\n },\n \"annotations\": {\n  \"list\": []\n },\n \"panels\": [\n  {\n   \"type\": \"stat\",\n   \"title\": \"Published today\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT count(*) AS value FROM articles WHERE status = 'published' AND published_at > date_trunc('day', now())\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 0,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"color\": {\n      \"mode\": \"thresholds\"\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 1\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Waiting for review\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT count(*) AS value FROM articles WHERE status = 'review'\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 4,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 10\n       },\n       {\n        \"color\": \"red\",\n        \"value\": 25\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 2\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Being rewritten\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT count(*) AS value FROM articles WHERE status = 'regenerating'\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 8,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"blue\",\n        \"value\": 1\n       }\n      ]\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 3\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Passed checks (7 days)\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT avg(CASE WHEN jsonb_array_length(coalesce(checks->'problems', '[]')) = 0 THEN 1 ELSE 0 END) AS value\\n                                               FROM articles WHERE created_at > now() - interval '7 days'\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 12,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\",\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 0.6\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 0.85\n       }\n      ]\n     },\n     \"decimals\": 0\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 4\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"OpenAI tokens today\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT sum(coalesce((checks->'usage'->>'input_tokens')::numeric, 0) + coalesce((checks->'usage'->>'output_tokens')::numeric, 0)) AS value FROM articles WHERE updated_at > date_trunc('day', now())\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 16,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\",\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"decimals\": 0\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 5\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Est. OpenAI cost (30 days)\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT sum(coalesce((checks->'usage'->>'input_tokens')::numeric, 0)) / 1e6 * $in_price + sum(coalesce((checks->'usage'->>'output_tokens')::numeric, 0)) / 1e6 * $out_price AS value\\n                                                   FROM articles WHERE updated_at > now() - interval '30 days'\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 20,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"currencyUSD\",\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"decimals\": 2\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"description\": \"Uses the $/1M-token prices in the boxes at the top; set them from your OpenAI pricing page.\",\n   \"id\": 6\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"Articles published per day\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT date_trunc('day', published_at) AS time, kind AS metric, count(*) AS value\\n                                                 FROM articles WHERE status = 'published' AND $__timeFilter(published_at)\\n                                                 GROUP BY 1, 2 ORDER BY 1\",\n     \"format\": \"time_series\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 12,\n    \"h\": 8,\n    \"x\": 0,\n    \"y\": 4\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 80,\n      \"showPoints\": \"never\",\n      \"spanNulls\": true,\n      \"stacking\": {\n       \"mode\": \"normal\",\n       \"group\": \"A\"\n      },\n      \"drawStyle\": \"bars\"\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\"\n    }\n   },\n   \"id\": 7\n  },\n  {\n   \"type\": \"timeseries\",\n   \"title\": \"OpenAI tokens per day\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT date_trunc('day', updated_at) AS time, sum(coalesce((checks->'usage'->>'input_tokens')::numeric, 0)) AS input, sum(coalesce((checks->'usage'->>'output_tokens')::numeric, 0)) AS output\\n                                             FROM articles WHERE $__timeFilter(updated_at) GROUP BY 1 ORDER BY 1\",\n     \"format\": \"time_series\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 12,\n    \"h\": 8,\n    \"x\": 12,\n    \"y\": 4\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"custom\": {\n      \"lineWidth\": 1,\n      \"fillOpacity\": 80,\n      \"showPoints\": \"never\",\n      \"spanNulls\": true,\n      \"stacking\": {\n       \"mode\": \"normal\",\n       \"group\": \"A\"\n      },\n      \"drawStyle\": \"bars\"\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    },\n    \"tooltip\": {\n     \"mode\": \"multi\"\n    }\n   },\n   \"id\": 8\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"Recent stories\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"SELECT to_char(coalesce(published_at, updated_at) AT TIME ZONE 'America/New_York', 'Dy HH12:MI AM') AS \\\"when\\\",\\n                   league, kind, status, headline,\\n                   jsonb_array_length(coalesce(checks->'problems', '[]')) AS problems,\\n                   coalesce((checks->>'attempts')::int, 0) AS attempts, (coalesce((checks->'usage'->>'input_tokens')::numeric, 0) + coalesce((checks->'usage'->>'output_tokens')::numeric, 0))::int AS tokens, model\\n            FROM articles ORDER BY coalesce(published_at, updated_at) DESC LIMIT 40\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 24,\n    \"h\": 12,\n    \"x\": 0,\n    \"y\": 12\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\"\n   },\n   \"id\": 9\n  },\n  {\n   \"type\": \"logs\",\n   \"title\": \"Newsroom job and worker\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"{namespace=\\\"$ns\\\", app=~\\\"newsroom|newsroom-worker\\\"}\",\n     \"refId\": \"A\",\n     \"queryType\": \"range\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"loki\",\n    \"uid\": \"loki\"\n   },\n   \"gridPos\": {\n    \"w\": 24,\n    \"h\": 9,\n    \"x\": 0,\n    \"y\": 24\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"options\": {\n    \"showTime\": true,\n    \"wrapLogMessage\": true,\n    \"sortOrder\": \"Descending\",\n    \"enableLogDetails\": true\n   },\n   \"id\": 10\n  }\n ]\n}"}}
