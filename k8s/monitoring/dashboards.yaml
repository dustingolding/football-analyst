{"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": "dashboard-sw-models", "namespace": "monitoring", "labels": {"grafana_dashboard": "1"}, "annotations": {"grafana_folder": "SidelineWire"}}, "data": {"sw-models.json": "{\n \"uid\": \"sw-models\",\n \"title\": \"SidelineWire \\u00b7 Models vs Vegas\",\n \"description\": \"Headline independent model (NFL linear, college XGBoost) against the Vegas line, this season.\",\n \"tags\": [\n  \"sidelinewire\"\n ],\n \"timezone\": \"America/New_York\",\n \"schemaVersion\": 39,\n \"version\": 1,\n \"editable\": true,\n \"graphTooltip\": 1,\n \"refresh\": \"\",\n \"time\": {\n  \"from\": \"now-7d\",\n  \"to\": \"now\"\n },\n \"templating\": {\n  \"list\": [\n   {\n    \"type\": \"datasource\",\n    \"name\": \"ds\",\n    \"label\": \"Environment\",\n    \"query\": \"grafana-postgresql-datasource\",\n    \"regex\": \"/SidelineWire/\",\n    \"current\": {\n     \"text\": \"SidelineWire prod DB\",\n     \"value\": \"pg-prod\"\n    }\n   },\n   {\n    \"type\": \"custom\",\n    \"name\": \"league\",\n    \"label\": \"League\",\n    \"query\": \"nfl,cfb\",\n    \"current\": {\n     \"text\": \"nfl\",\n     \"value\": \"nfl\"\n    },\n    \"options\": [\n     {\n      \"text\": \"nfl\",\n      \"value\": \"nfl\",\n      \"selected\": true\n     },\n     {\n      \"text\": \"cfb\",\n      \"value\": \"cfb\",\n      \"selected\": false\n     }\n    ]\n   },\n   {\n    \"type\": \"custom\",\n    \"name\": \"season\",\n    \"label\": \"Season\",\n    \"query\": \"2026,2025,2024\",\n    \"current\": {\n     \"text\": \"2026\",\n     \"value\": \"2026\"\n    },\n    \"options\": [\n     {\n      \"text\": \"2026\",\n      \"value\": \"2026\",\n      \"selected\": true\n     },\n     {\n      \"text\": \"2025\",\n      \"value\": \"2025\",\n      \"selected\": false\n     },\n     {\n      \"text\": \"2024\",\n      \"value\": \"2024\",\n      \"selected\": false\n     }\n    ]\n   }\n  ]\n },\n \"annotations\": {\n  \"list\": []\n },\n \"panels\": [\n  {\n   \"type\": \"stat\",\n   \"title\": \"Games scored\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\nSELECT count(*) AS value FROM g\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 0,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"color\": {\n      \"mode\": \"thresholds\"\n     }\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 1\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Winners picked (headline model)\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\nSELECT avg(((prob > 0.5) = (margin > 0))::int) AS value FROM g\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 4,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\",\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"decimals\": 1\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 2\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Vegas favorite won\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\nSELECT avg(CASE WHEN spread IS NOT NULL AND spread <> 0 THEN ((spread < 0) = (margin > 0))::int END) AS value FROM g\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 8,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\",\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"decimals\": 1\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 3\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Against the spread\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\nSELECT avg(CASE WHEN spread IS NOT NULL AND margin + spread <> 0 AND pm + spread <> 0 THEN ((pm + spread > 0) = (margin + spread > 0))::int END) AS value FROM g\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 12,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\",\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"red\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 0.5\n       },\n       {\n        \"color\": \"green\",\n        \"value\": 0.524\n       }\n      ]\n     },\n     \"decimals\": 1\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"description\": \"52.4% is break-even at standard -110 odds.\",\n   \"id\": 4\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Brier score (lower is better)\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\nSELECT avg(power(prob - (margin > 0)::int, 2)) AS value FROM g\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 16,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"decimals\": 3\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 5\n  },\n  {\n   \"type\": \"stat\",\n   \"title\": \"Avg miss on margin (pts)\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\nSELECT avg(abs(margin - pm)) AS value FROM g\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 4,\n    \"h\": 4,\n    \"x\": 20,\n    \"y\": 0\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"color\": {\n      \"mode\": \"thresholds\"\n     },\n     \"decimals\": 1\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    },\n    \"colorMode\": \"value\",\n    \"graphMode\": \"area\",\n    \"textMode\": \"auto\"\n   },\n   \"id\": 6\n  },\n  {\n   \"type\": \"barchart\",\n   \"title\": \"Winners picked by week: model vs Vegas\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\n\\n            SELECT week::text AS week, avg(((prob > 0.5) = (margin > 0))::int) AS model, avg(CASE WHEN spread IS NOT NULL AND spread <> 0 THEN ((spread < 0) = (margin > 0))::int END) AS vegas FROM g GROUP BY week ORDER BY week\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 12,\n    \"h\": 9,\n    \"x\": 0,\n    \"y\": 4\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\",\n     \"min\": 0,\n     \"max\": 1\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"xField\": \"week\",\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    },\n    \"barWidth\": 0.7\n   },\n   \"id\": 7\n  },\n  {\n   \"type\": \"barchart\",\n   \"title\": \"Against the spread by week\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\n\\n            SELECT week::text AS week, avg(CASE WHEN spread IS NOT NULL AND margin + spread <> 0 AND pm + spread <> 0 THEN ((pm + spread > 0) = (margin + spread > 0))::int END) AS ats FROM g GROUP BY week ORDER BY week\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 12,\n    \"h\": 9,\n    \"x\": 12,\n    \"y\": 4\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\",\n     \"min\": 0,\n     \"max\": 1\n    },\n    \"overrides\": []\n   },\n   \"options\": {\n    \"xField\": \"week\",\n    \"legend\": {\n     \"displayMode\": \"list\",\n     \"placement\": \"bottom\"\n    },\n    \"barWidth\": 0.7\n   },\n   \"id\": 8\n  },\n  {\n   \"type\": \"table\",\n   \"title\": \"By week\",\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"grafana-postgresql-datasource\",\n      \"uid\": \"${ds}\"\n     },\n     \"rawSql\": \"WITH lines AS (\\n    SELECT game_id, percentile_cont(0.5) WITHIN GROUP (ORDER BY home_spread) AS spread\\n    FROM odds WHERE league = '$league' AND home_spread IS NOT NULL GROUP BY game_id),\\ng AS (\\n    SELECT gm.week, gm.start_time, gm.home_score - gm.away_score AS margin, p.home_win_prob AS prob,\\n           p.predicted_margin AS pm, l.spread\\n    FROM games gm\\n    JOIN predictions p ON p.league = gm.league AND p.game_id = gm.game_id\\n                      AND p.model = CASE WHEN '$league' = 'nfl' THEN 'linear' ELSE 'xgb' END\\n    LEFT JOIN lines l ON l.game_id = gm.game_id\\n    WHERE gm.league = '$league' AND gm.season = $season AND gm.completed AND gm.season_type = 2\\n      AND gm.home_score IS NOT NULL AND gm.home_score <> gm.away_score)\\n\\n            SELECT week, count(*) AS games, round(100 * avg(((prob > 0.5) = (margin > 0))::int), 1) AS \\\"model %\\\", round(100 * avg(CASE WHEN spread IS NOT NULL AND spread <> 0 THEN ((spread < 0) = (margin > 0))::int END), 1) AS \\\"vegas %\\\",\\n                   round(100 * avg(CASE WHEN spread IS NOT NULL AND margin + spread <> 0 AND pm + spread <> 0 THEN ((pm + spread > 0) = (margin + spread > 0))::int END), 1) AS \\\"ats %\\\", round(avg(abs(margin - pm))::numeric, 1) AS \\\"margin miss\\\"\\n            FROM g GROUP BY week ORDER BY week\",\n     \"format\": \"table\",\n     \"rawQuery\": true,\n     \"editorMode\": \"code\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"datasource\": {\n    \"type\": \"grafana-postgresql-datasource\",\n    \"uid\": \"${ds}\"\n   },\n   \"gridPos\": {\n    \"w\": 24,\n    \"h\": 9,\n    \"x\": 0,\n    \"y\": 13\n   },\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"options\": {\n    \"showHeader\": true,\n    \"cellHeight\": \"sm\"\n   },\n   \"id\": 9\n  }\n ]\n}"}}
